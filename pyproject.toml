[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finspect"
version = "0.1.0"
description = "Evidence-grounded financial research prototype using SEC filings"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "requests>=2.31",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
